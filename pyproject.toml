[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-harness"
version = "0.1.0"
description = "A self-contained, persistent agent runtime for the Agent Harness assignment"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1", "jsonschema>=4.23,<5", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
small-harness = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["static/*", "fixtures/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires configured credentials and makes paid API requests"]

